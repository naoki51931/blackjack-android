name: Build and Release Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk blackjack21.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: blackjack21-apk
          path: blackjack21.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish fixed v1.0 release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0
          name: Blackjack 21 v1.0
          body: |
            Blackjack 21 Android APK v1.0

            Latest v1.0 build. The version number stays at 1.0.
          files: blackjack21.apk
          prerelease: false
          make_latest: true
